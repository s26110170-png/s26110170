<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>朋友對我的動態留言板</title>
  
  <style>
    /* =========================================================
       1. 全局變數與基礎設定 (方便後續微調顏色與樣式)
       ========================================================= */
    :root {
      /* 背景與文字顏色 */
      --bg-color: #0d1117;
      --card-bg: rgba(22, 27, 34, 0.8);
      --text-main: #f0f6fc;
      --text-sub: #8b949e;
      
      /* 霓虹發光主色 (極光風格) */
      --accent-color: #00f2fe;        /* 青藍光 */
      --accent-glow: rgba(0, 242, 254, 0.6);
      --secondary-glow: rgba(79, 172, 254, 0.4);
      
      /* 動畫速度與間隔設定 (提示：JS 中也有輪播秒數控制) */
      --transition-speed: 0.5s;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      padding: 2rem;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(0, 242, 254, 0.05) 0%, transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(147, 51, 234, 0.05) 0%, transparent 40%);
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 0.5rem;
    }

    header p {
      color: var(--text-sub);
      font-size: 0.95rem;
    }

    /* =========================================================
       2. 載入中動畫 (Loading Animation)
       ========================================================= */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 0;
    }

    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(0, 242, 254, 0.1);
      border-top-color: var(--accent-color);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      box-shadow: 0 0 15px var(--accent-glow);
    }

    .loading-text {
      margin-top: 1.2rem;
      color: var(--accent-color);
      letter-spacing: 1.5px;
      font-size: 1.1rem;
      animation: pulse 1.5s infinite ease-in-out;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }

    /* =========================================================
       3. Masonry 瀑布流版面設定
       ========================================================= */
    .masonry-container {
      /* 依螢幕寬度自動調整欄數 */
      column-count: 4;
      column-gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 響應式欄數調整 */
    @media (max-width: 1200px) { .masonry-container { column-count: 3; } }
    @media (max-width: 800px)  { .masonry-container { column-count: 2; } }
    @media (max-width: 500px)  { .masonry-container { column-count: 1; } }

    /* =========================================================
       4. 卡片基本樣式與 Highlight 特效
       ========================================================= */
    .card {
      break-inside: avoid; /* 避免卡片跨欄斷裂 */
      margin-bottom: 1.5rem;
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      padding: 1.5rem;
      backdrop-filter: blur(8px);
      
      /* 平滑過渡效果：控制放大、透明度、模糊與陰影變化 */
      transition: all var(--transition-speed) cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
      opacity: 0.6; /* 預設略微淡化 */
      filter: blur(1px); /* 預設微模糊 */
      transform: scale(0.98);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 0.5rem;
    }

    .card-name {
      font-weight: 600;
      font-size: 1.1rem;
      color: #fff;
    }

    .card-time {
      font-size: 0.75rem;
      color: var(--text-sub);
    }

    .card-content {
      font-size: 0.95rem;
      line-height: 1.6;
      color: #c9d1d9;
      white-space: pre-wrap; /* 保留留言換行 */
      word-break: break-word;
    }

    /* --- 【核心特效】亮起 / 焦點狀態 (Highlight Class) --- */
    .card.highlight {
      opacity: 1;
      filter: blur(0px);
      transform: scale(1.05); /* 放大卡片 */
      z-index: 10;
      background: rgba(22, 27, 34, 0.95);
      
      /* 邊框與螢光特效 */
      border-color: var(--accent-color);
      box-shadow: 
        0 0 20px var(--accent-glow),
        0 0 40px var(--secondary-glow);
    }

    .card.highlight .card-name {
      color: var(--accent-color);
      text-shadow: 0 0 8px var(--accent-glow);
    }
  </style>
</head>
<body>

  <header>
    <h1>留言藝廊 · 朋友對我說的話</h1>
    <p>Every message is a glowing memory.</p>
  </header>

  <!-- 讀取中動畫 -->
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">讀取留言中…</div>
  </div>

  <!-- 瀑布流留言容器 -->
  <main id="masonry" class="masonry-container"></main>

  <script>
    /* =========================================================
       控制參數設定 (純手工修改區)
       ========================================================= */
    const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vTLBOeZ5JW3tNCQbAuHhbpJBHPRER6qPTFr2hXFZt2n9rnH_5Si8vWuI47x9dvelI_SLGnhglryJ6kl/pub?output=csv';
    
    // 【修改秒數】每隔多少毫秒 (ms) 切換下一張卡片 highlight (3000ms = 3秒)
    const ROTATE_INTERVAL_MS = 3000; 

    /* =========================================================
       1. CSV 解析器 (相容留言內的逗號與雙引號)
       ========================================================= */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let inQuotes = false;
      let entry = '';

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const next = text[i+1];

        if (c === '"') {
          if (inQuotes && next === '"') { entry += '"'; i++; } // 轉義雙引號
          else { inQuotes = !inQuotes; } // 切換引號狀態
        } 
        else if (c === ',' && !inQuotes) {
          row.push(entry.trim());
          entry = '';
        } 
        else if ((c === '\r' || c === '\n') && !inQuotes) {
          if (c === '\r' && next === '\n') { i++; }
          row.push(entry.trim());
          if (row.some(field => field !== '')) { lines.push(row); }
          row = [];
          entry = '';
        } 
        else {
          entry += c;
        }
      }
      if (entry || row.length > 0) {
        row.push(entry.trim());
        lines.push(row);
      }
      return lines;
    }

    /* =========================================================
       2. 抓取資料與建立 DOM
       ========================================================= */
    async function initBoard() {
      const loadingEl = document.getElementById('loading');
      const containerEl = document.getElementById('masonry');

      try {
        const response = await fetch(CSV_URL);
        if (!response.ok) throw new Error('網路請求失敗');
        
        const rawText = await response.text();
        const parsedData = parseCSV(rawText);

        // 移除 CSV 標頭欄位 (第一列: 時間標記, 名字, 留言內容)
        const rows = parsedData.slice(1);

        // 關閉 Loading 動畫
        loadingEl.style.display = 'none';

        if (rows.length === 0) {
          containerEl.innerHTML = '<p style="text-align:center; grid-column: 1/-1;">目前還沒有任何留言喔！</p>';
          return;
        }

        // 動態生成 HTML 卡片
        rows.forEach(row => {
          const time = row[0] || '';
          const name = row[1] || '匿名朋友';
          const message = row[2] || '';

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="card-header">
              <span class="card-name">${escapeHTML(name)}</span>
              <span class="card-time">${escapeHTML(time)}</span>
            </div>
            <div class="card-content">${escapeHTML(message)}</div>
          `;
          containerEl.appendChild(card);
        });

        // 資料渲染結束後，啟動燈光輪播特效
        startHighlightRotation();

      } catch (error) {
        console.error('Fetch Error:', error);
        loadingEl.innerHTML = `<div style="color: #ff5555;">載入留言失敗，請確認網路或試算表網址權限。</div>`;
      }
    }

    /* 安全防範：轉義 HTML 特殊字元防止 XSS */
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    /* =========================================================
       3. 輪播 Highlight 動畫 logic
       ========================================================= */
    function startHighlightRotation() {
      const cards = document.querySelectorAll('.card');
      if (cards.length === 0) return;

      let currentIndex = 0;

      // 初次啟動時亮起第一張
      cards[currentIndex].classList.add('highlight');

      // 設定計時器，依序輪替
      setInterval(() => {
        // 移除當前卡片的亮起狀態
        cards[currentIndex].classList.remove('highlight');

        // 計算下一次亮起的索引號碼
        currentIndex = (currentIndex + 1) % cards.length;

        // 加上 Highlight 特效類別
        cards[currentIndex].classList.add('highlight');

        // (可選) 讓畫面自動平滑滾動至焦點卡片
        cards[currentIndex].scrollIntoView({
          behavior: 'smooth',
          block: 'nearest'
        });

      }, ROTATE_INTERVAL_MS);
    }

    // 當 DOM 準備完成後執行初始化
    document.addEventListener('DOMContentLoaded', initBoard);
  </script>
</body>
</html>
