<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>雪雅的個人數位名片</title>
    <!-- 連結 CSS 樣式檔案 -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 名片主體卡片 -->
    <div class="card">
        <!-- 1. 圓形大頭貼 (可更換成自己的照片網址或本地檔名) -->
        <img class="avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=300&q=80" alt="雪雅的大頭貼">

        <!-- 2. 名字與自我介紹 -->
        <h1 class="name">雪雅</h1>
        <p class="bio">✨ 26110170</p>

        <!-- 3. 按鈕區塊 -->
        <div class="button-group">
            <!-- Instagram 按鈕 (請將 href 換成你的 IG 連結) -->
            <a href="https://www.instagram.com" target="_blank" class="btn btn-ig">
                Instagram
            </a>

            <!-- Email 按鈕 (請將 href 中的信箱換成你的 Email) -->
            <a href="mailto:your_email@example.com" class="btn btn-email">
                Email 聯絡我
            </a>
        </div>
    </div>

</body>
</html>
